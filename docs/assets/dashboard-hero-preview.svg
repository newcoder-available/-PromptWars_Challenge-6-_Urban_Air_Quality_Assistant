    <text x="0" y="72" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="64" font-weight="900">179</text>
    <text x="112" y="72" fill="rgba(255,255,255,0.82)" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">AQI (US)</text>

    <!-- Status frosted pill -->
    <text x="186" y="24" fill="rgba(255,255,255,0.82)" font-family="system-ui,Segoe UI,sans-serif" font-size="12">Air Quality is</text>
    <rect x="186" y="34" width="126" height="40" rx="10" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.28)"/>
    <text x="249" y="60" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="800">Unhealthy</text>

    <!-- PM2.5 & PM10 -->
    <text x="0" y="110" fill="rgba(255,255,255,0.92)" font-family="system-ui,Segoe UI,sans-serif" font-size="14">PM2.5 : <tspan font-weight="800" fill="#ffffff">95 µg/m³</tspan></text>
    <text x="148" y="110" fill="rgba(255,255,255,0.92)" font-family="system-ui,Segoe UI,sans-serif" font-size="14">PM10 : <tspan font-weight="800" fill="#ffffff">133 µg/m³</tspan></text>

    <rect x="0" y="124" width="144" height="22" rx="11" fill="rgba(15,23,42,0.45)" stroke="rgba(255,255,255,0.25)"/>
    <text x="72" y="139" text-anchor="middle" fill="#fecdd3" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="800">6.3× WHO 24h limit</text>

    <!-- Spectrum Bar -->
    <g transform="translate(0, 162)">
      <text x="0" y="0" fill="rgba(255,255,255,0.88)" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="700">Good</text>
      <text x="54" y="0" fill="rgba(255,255,255,0.88)" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="700">Moderate</text>
      <text x="115" y="0" fill="rgba(255,255,255,0.88)" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="700">Poor</text>
      <text x="158" y="0" fill="rgba(255,255,255,0.88)" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="700">Unhealthy</text>
      <text x="220" y="0" fill="rgba(255,255,255,0.88)" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="700">Severe</text>
      <text x="266" y="0" fill="rgba(255,255,255,0.88)" font-family="system-ui,Segoe UI,sans-serif" font-size="10" font-weight="700">Hazardous</text>

      <rect x="0" y="9" width="51" height="8" rx="4" fill="#22c55e"/>
      <rect x="54" y="9" width="51" height="8" rx="4" fill="#eab308"/>
      <rect x="108" y="9" width="51" height="8" rx="4" fill="#f97316"/>
      <rect x="162" y="9" width="51" height="8" rx="4" fill="#ef4444"/>
      <rect x="216" y="9" width="51" height="8" rx="4" fill="#a855f7"/>
      <rect x="270" y="9" width="51" height="8" rx="4" fill="#9f1239"/>

      <!-- Pointer dot at AQI 179 -->
      <circle cx="192" cy="13" r="7" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>

      <text x="0" y="32" fill="rgba(255,255,255,0.75)" font-family="system-ui,Segoe UI,sans-serif" font-size="10">0</text>
      <text x="54" y="32" fill="rgba(255,255,255,0.75)" font-family="system-ui,Segoe UI,sans-serif" font-size="10">50</text>
      <text x="108" y="32" fill="rgba(255,255,255,0.75)" font-family="system-ui,Segoe UI,sans-serif" font-size="10">100</text>
      <text x="162" y="32" fill="rgba(255,255,255,0.75)" font-family="system-ui,Segoe UI,sans-serif" font-size="10">150</text>
      <text x="216" y="32" fill="rgba(255,255,255,0.75)" font-family="system-ui,Segoe UI,sans-serif" font-size="10">200</text>
      <text x="270" y="32" fill="rgba(255,255,255,0.75)" font-family="system-ui,Segoe UI,sans-serif" font-size="10">301+</text>
