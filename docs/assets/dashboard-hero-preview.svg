    <rect width="748" height="54" rx="12" fill="#111b2e" stroke="#2a3a57"/>
    <rect x="14" y="11" width="96" height="32" rx="8" fill="#dc2626"/>
    <text x="62" y="31" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="800">Rank  60th</text>
    <text x="128" y="31" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Currently, New Delhi ranks near #60 globally. Low wind (4 km/h) is trapping winter smog near ground level.</text>
  </g>

