    <path d="M62 21 Q68 12 75 20" fill="none" stroke="#3b1f14" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="38" cy="56" r="5" fill="#f5c09a" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="92" cy="56" r="5" fill="#f5c09a" stroke="#0f172a" stroke-width="1.8"/>
    <path d="M49 45 Q55 42 60 46" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M70 46 Q75 42 81 45" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M50 53 Q55 50 60 53" fill="none" stroke="#0f172a" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M70 53 Q75 50 80 53" fill="none" stroke="#0f172a" stroke-width="2.3" stroke-linecap="round"/>
    <path d="M84 41 Q88 47 84 50 Q80 47 84 41 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="1.2"/>
    <path d="M39 58 L50 63" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M91 58 L80 63" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M40 62 L50 71" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M90 62 L80 71" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M49 60 Q65 56 81 60 L79 75 Q65 81 51 75 Z" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <line x1="55" y1="65" x2="75" y2="65" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="56" y1="70" x2="74" y2="70" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Right Column inside Hero: Frosted Weather Glass Card -->
  <g transform="translate(550, 154)">
    <rect width="248" height="148" rx="14" fill="rgba(15,23,42,0.42)" stroke="rgba(255,255,255,0.22)"/>
    <!-- Cloud glyph + temp -->
