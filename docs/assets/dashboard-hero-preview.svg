    <circle cx="1028" cy="196" r="16" fill="#9333ea" stroke="#ffffff" stroke-width="2"/><text x="1028" y="200">224</text>
    <circle cx="894" cy="214" r="16" fill="#e11d48" stroke="#ffffff" stroke-width="2"/><text x="894" y="218">165</text>
    <circle cx="972" cy="238" r="19" fill="#e11d48" stroke="#ffffff" stroke-width="3"/><text x="972" y="242">179</text>
    <circle cx="1050" cy="256" r="16" fill="#9333ea" stroke="#ffffff" stroke-width="2"/><text x="1050" y="260">242</text>
    <circle cx="892" cy="284" r="16" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="892" y="288">138</text>
    <circle cx="988" cy="306" r="16" fill="#e11d48" stroke="#ffffff" stroke-width="2"/><text x="988" y="310">204</text>
  </g>

  <!-- Selected Station Card inside Map -->
  <g transform="translate(856, 332)">
    <rect width="224" height="68" rx="10" fill="rgba(15,23,42,0.86)" stroke="rgba(255,255,255,0.18)"/>
    <text x="12" y="20" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="11.5" font-weight="800">New Delhi Central · 0.6 km</text>
    <text x="12" y="37" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="10.5">Residential Block · PM2.5: 95 µg/m³</text>
    <text x="12" y="56" fill="#86efac" font-family="system-ui,Segoe UI,sans-serif" font-size="10.5" font-weight="700">↗ Cleanest nearby: Green Park (AQI 138)</text>
