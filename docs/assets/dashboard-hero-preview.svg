    <text x="18" y="98" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="11">Humidity</text>
    <text x="18" y="120" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="800">44 %</text>

    <text x="96" y="98" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="11">Wind Speed</text>
    <text x="96" y="120" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="800">4 km/h</text>

    <text x="186" y="98" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="11">UV Index</text>
    <text x="186" y="120" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="800">0</text>
