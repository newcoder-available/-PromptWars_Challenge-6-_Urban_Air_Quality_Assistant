<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" width="1120" height="440" role="img" aria-label="AirShield AI Live Urban Air Quality Dashboard Preview showing Live AQI 179, Masked Mascot, Frosted Weather Card, Global Rank, and Hyperlocal AQI Map">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24151c"/>
      <stop offset="48%" stop-color="#5e2036"/>
      <stop offset="100%" stop-color="#9e3156"/>
    </linearGradient>
    <linearGradient id="mapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#3b1d36"/>
      <stop offset="100%" stop-color="#6b2147"/>
    </linearGradient>
    <clipPath id="heroClip">
      <rect x="28" y="106" width="796" height="260" rx="20"/>
    </clipPath>
    <clipPath id="mapClip">
      <rect x="844" y="106" width="248" height="308" rx="20"/>
    </clipPath>
  </defs>

  <!-- Canvas background -->
  <rect width="1120" height="440" rx="22" fill="#0b1220"/>

  <!-- Top Live Strip -->
  <g transform="translate(28, 22)">
    <rect x="0" y="0" width="60" height="22" rx="6" fill="#dc2626"/>
    <circle cx="14" cy="11" r="3.5" fill="#ffffff"/>
    <text x="23" y="15" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="800" letter-spacing="0.06em">LIVE</text>
    <text x="72" y="15" fill="#94a3b8" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-style="italic">Last Updated: Local Time · Real-time SSE Stream Active</text>

    <text x="0" y="48" fill="#f8fafc" font-family="system-ui,Segoe UI,sans-serif" font-size="23" font-weight="800">New Delhi Air Quality Index (AQI) | Air Pollution</text>
    <text x="0" y="69" fill="#cbd5e1" font-family="system-ui,Segoe UI,sans-serif" font-size="13">Real-time PM2.5, PM10 &amp; winter smog dispersion intelligence · AirShield AI</text>

    <!-- Action pills top-right -->
    <g transform="translate(795, 22)">
      <rect x="0" y="0" width="96" height="32" rx="8" fill="#111b2e" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="48" y="20" text-anchor="middle" fill="#e0f2fe" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700">Live Sync On</text>

      <rect x="106" y="0" width="84" height="32" rx="8" fill="#111b2e" stroke="#475569"/>
      <text x="148" y="20" text-anchor="middle" fill="#f8fafc" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="700">Locate me</text>

      <circle cx="214" cy="16" r="16" fill="rgba(244,63,94,0.16)" stroke="#f43f5e"/>
      <text x="214" y="21" text-anchor="middle" fill="#f43f5e" font-family="system-ui,Segoe UI,sans-serif" font-size="14">♥</text>

      <circle cx="254" cy="16" r="16" fill="#111b2e" stroke="#475569"/>
      <text x="254" y="20" text-anchor="middle" fill="#f8fafc" font-family="system-ui,Segoe UI,sans-serif" font-size="13">↗</text>
    </g>
  </g>

  <!-- Main Atmospheric Hero Banner -->
  <rect x="28" y="106" width="796" height="260" rx="20" fill="url(#heroGrad)" stroke="rgba(255,255,255,0.16)"/>

  <!-- Skyline Silhouette inside Hero -->
  <g clip-path="url(#heroClip)">
    <path d="M28 366 L28 332 L58 332 L58 312 L78 312 L78 292 L98 292 L98 322 L130 322 L130 282 L148 272 L166 282 L166 326 L210 326 L210 296 L228 296 L228 264 L242 264 L242 296 L264 296 L264 328 L302 328 L302 302 Q335 268 368 302 L368 328 L412 328 L412 284 L442 284 L442 324 L484 324 L484 270 L512 270 L512 294 L536 294 L536 324 L580 324 Q618 286 656 324 L700 324 L700 278 L730 278 L730 310 L760 310 L760 258 L778 258 L778 310 L824 310 L824 366 Z" fill="rgba(255,255,255,0.1)"/>
  </g>

