    <circle cx="32" cy="34" r="9" fill="#f8fafc"/>
    <line x1="22" y1="54" x2="54" y2="54" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <text x="66" y="48" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="28" font-weight="800">21 °C</text>
    <text x="230" y="46" text-anchor="end" fill="#f1f5f9" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="600">Smoky haze</text>

